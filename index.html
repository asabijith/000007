<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Tools + UDP C Code</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--muted:#6b7488;--accent:#4f46e5;--ok:#0f9d58;--err:#d93025;--line:#e3e7f0;--code:#11152a;--codetext:#e6e9f5}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c2f;--text:#eef0f8;--muted:#9aa3bd;--accent:#818cf8;--ok:#4ade80;--err:#f87171;--line:#2a3050;--code:#0a0d1c}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);padding:24px 14px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:680px}
  h1{text-align:center;margin:0 0 4px;font-size:1.6rem}
  .sub{text-align:center;color:var(--muted);margin:0 0 20px;font-size:.95rem}
  h3.sec{margin:26px 0 10px;font-size:1.2rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .card h2{margin:0 0 10px;font-size:1.1rem}
  .row{display:flex;gap:8px}
  input{flex:1;min-width:0;padding:10px 12px;font-size:1rem;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text)}
  input:focus{outline:2px solid var(--accent);border-color:transparent}
  button{padding:10px 18px;font-size:1rem;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
  button:hover{opacity:.9}
  .out{margin-top:10px;min-height:1.4em;font-weight:600;word-break:break-all}
  .ok{color:var(--ok)} .err{color:var(--err)}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tab{background:transparent;color:var(--text);border:1px solid var(--line);padding:8px 14px;font-size:.95rem}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .blk{margin-bottom:14px}
  .bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600}
  .cp{padding:6px 12px;font-size:.85rem}
  .cp.done{background:var(--ok)}
  pre{margin:0;background:var(--code);color:var(--codetext);padding:12px;border-radius:10px;overflow-x:auto;font-size:.82rem;line-height:1.45}
  .note{color:var(--muted);font-size:.88rem;margin:6px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Number Tools</h1>
  <p class="sub">Square &middot; Factorial &middot; Even or Odd</p>


  <h3 class="sec">UDP Server and Client Code (C)</h3>
  <div class="card">
    <div class="tabs" id="tabs"></div>
    <div id="codeArea"></div>
    <p class="note">Compile: <b>gcc server.c -o server</b> and <b>gcc client.c -o client</b>. Run the server first (Terminal 1), then the client (Terminal 2). Server and client must use the same port.</p>
  </div>
</div>

<script>
/* ---------- C code (String.raw keeps \n as typed) ---------- */
const mkClient=p=>String.raw`#include <stdio.h>
#include <string.h>
#include <arpa/inet.h>
int main(){
  int s=socket(AF_INET,SOCK_DGRAM,0),n; char b[100];
  struct sockaddr_in sa={AF_INET,htons(${p}),inet_addr("127.0.0.1")};
  printf("Enter integer: "); fgets(b,99,stdin); b[strcspn(b,"\n")]=0;
  sendto(s,b,strlen(b),0,(struct sockaddr*)&sa,sizeof sa);
  n=recvfrom(s,b,99,0,0,0); b[n]=0;
  printf("Reply: %s\n",b);
}`;

const PROGRAMS=[
 {name:"Square",port:8105,input:"12",reply:"Square of 12 = 144",
  server:String.raw`#include <stdio.h>
#include <string.h>
#include <stdlib.h>
#include <arpa/inet.h>
int main(){
  int s=socket(AF_INET,SOCK_DGRAM,0),n; char b[100],r[100];
  long long x;
  struct sockaddr_in sa={AF_INET,htons(8105),INADDR_ANY},ca; socklen_t l=sizeof ca;
  bind(s,(struct sockaddr*)&sa,sizeof sa);
  n=recvfrom(s,b,99,0,(struct sockaddr*)&ca,&l); b[n]=0;
  x=atoll(b); sprintf(r,"Square of %lld = %lld",x,x*x);
  sendto(s,r,strlen(r),0,(struct sockaddr*)&ca,l);
}`},
 {name:"Factorial",port:8106,input:"5",reply:"Factorial of 5 = 120",
  server:String.raw`#include <stdio.h>
#include <string.h>
#include <stdlib.h>
#include <arpa/inet.h>
int main(){
  int s=socket(AF_INET,SOCK_DGRAM,0),n,i,N; char b[100],r[100];
  unsigned long long f=1;
  struct sockaddr_in sa={AF_INET,htons(8106),INADDR_ANY},ca; socklen_t l=sizeof ca;
  bind(s,(struct sockaddr*)&sa,sizeof sa);
  n=recvfrom(s,b,99,0,(struct sockaddr*)&ca,&l); b[n]=0;
  N=atoi(b);
  for(i=2;i<=N;i++) f*=i;
  sprintf(r,"Factorial of %d = %llu",N,f);
  sendto(s,r,strlen(r),0,(struct sockaddr*)&ca,l);
}`},
 {name:"Even or Odd",port:8102,input:"27",reply:"27 is ODD",
  server:String.raw`#include <stdio.h>
#include <string.h>
#include <stdlib.h>
#include <arpa/inet.h>
int main(){
  int s=socket(AF_INET,SOCK_DGRAM,0),n,i; char b[100],r[100];
  struct sockaddr_in sa={AF_INET,htons(8102),INADDR_ANY},ca; socklen_t l=sizeof ca;
  bind(s,(struct sockaddr*)&sa,sizeof sa);
  n=recvfrom(s,b,99,0,(struct sockaddr*)&ca,&l); b[n]=0;
  i=atoi(b); sprintf(r,"%d is %s",i,i%2?"ODD":"EVEN");
  sendto(s,r,strlen(r),0,(struct sockaddr*)&ca,l);
}`}
];

/* ---------- Copy button ---------- */
function copyText(text,btn){
  const ok=()=>{btn.textContent="Copied!";btn.classList.add("done");
    setTimeout(()=>{btn.textContent="Copy";btn.classList.remove("done");},1500);};
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(ok).catch(()=>fallback(text,ok));
  }else fallback(text,ok);
}
function fallback(text,done){
  const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";
  document.body.appendChild(t);t.select();
  try{document.execCommand("copy");done();}catch(e){alert("Copy failed. Select the code and press Ctrl+C.");}
  document.body.removeChild(t);
}

/* ---------- Render tabs and code blocks ---------- */
function block(title,code){
  const d=document.createElement("div");d.className="blk";
  const h=document.createElement("div");h.className="bh";
  const s=document.createElement("span");s.textContent=title;
  const b=document.createElement("button");b.className="cp";b.textContent="Copy";
  b.onclick=()=>copyText(code,b);
  h.append(s,b);
  const pre=document.createElement("pre");const c=document.createElement("code");c.textContent=code;pre.appendChild(c);
  d.append(h,pre);return d;
}
function render(i){
  const p=PROGRAMS[i];
  document.querySelectorAll(".tab").forEach((t,k)=>t.classList.toggle("on",k===i));
  const area=document.getElementById("codeArea");area.innerHTML="";
  area.append(block(`server.c  (port ${p.port})`,p.server),block(`client.c  (port ${p.port})`,mkClient(p.port)));
  const o=document.createElement("p");o.className="note";
  o.textContent=`Output: Enter integer: ${p.input}  ->  Reply: ${p.reply}`;
  area.appendChild(o);
}
PROGRAMS.forEach((p,i)=>{
  const t=document.createElement("button");t.className="tab";t.textContent=p.name;t.onclick=()=>render(i);
  document.getElementById("tabs").appendChild(t);
});
render(0);
</script>
</body>
</html>
